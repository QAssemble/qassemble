[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "QAssemble"
version = "1.0.0"
description = "Pure-Python quantum simulation package for electronic structure calculations"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "matplotlib",
    "pydlr",
    "sympy",
    "pymatgen",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
qassemble = "QAssemble.CLI:main"
qassemble-migrate-hdf5 = "QAssemble.migrate_hdf5:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: manuscript-scale reproduction runs (deselect with '-m \"not slow\"')",
]
