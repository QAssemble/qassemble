[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "pycppdlr"
version = "0.1.0"
description = "Minimal NumPy bindings for cppdlr nodes, transforms and evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
install.components = ["python"]

[tool.pytest.ini_options]
markers = ["slow: large-cutoff accuracy and subprocess construction benchmarks"]
